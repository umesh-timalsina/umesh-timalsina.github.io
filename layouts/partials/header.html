{{- $current := . }}
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.profile.name }}, home">
      <span class="brand-mark" aria-hidden="true">UT</span>
      <span class="brand-name">{{ site.Params.profile.name }}</span>
    </a>
    <nav class="site-nav" id="site-nav" aria-label="Primary">
      <ul>
        {{- range site.Menus.main }}
          {{- $active := hasPrefix $current.RelPermalink .URL }}
          <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <div class="header-actions">
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span class="icon-sun">{{ partial "icon.html" "sun" }}</span>
        <span class="icon-moon">{{ partial "icon.html" "moon" }}</span>
      </button>
      <button class="icon-btn nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
        <span class="icon-open">{{ partial "icon.html" "menu-2" }}</span>
        <span class="icon-close">{{ partial "icon.html" "x" }}</span>
      </button>
    </div>
  </div>
</header>
