- title: Betty's Math
  start: 2025.17
  track: edtech
  summary: >-
    A math assessment and AI-tutoring platform embedded in the OECD's PILA
    and deployed in a randomized controlled trial across hundreds of schools
    in France, Germany, the Slovak Republic and Latvia. It includes an LLM
    tutor with learner-model context, LLM translation and knowledge-graph
    pipelines, xAPI logging and a real-time teacher dashboard.
  role: Creator & lead engineer
  years: 2025 – present
  tags: [SvelteKit, TypeScript, LLMs, xAPI, RCT]
  featured: true
  links: [] # TODO: add a public link if one exists

- title: SyncFlow
  start: 2023.5
  track: infra
  summary: >-
    An open-source WebRTC platform for real-time multimodal classroom data. It
    sustains 200 concurrent streams at about 200 ms latency and has archived
    400+ hours (more than 10 TB) for 1,000+ researchers and students. It is
    deployed in classroom studies in Indiana, Tennessee and North Carolina.
  role: Creator & lead engineer
  years: 2023 – present
  tags: [Rust, Next.js, WebRTC, LiveKit, Tauri, AWS ECS]
  featured: true
  links:
    - { label: Code, url: "https://github.com/oele-isis-vanderbilt/SyncFlow" }
    - { label: Paper, url: "/publications/" }
    - { label: Write-up, url: "/blog/days-of-collection-days-of-despair/" }

- title: ChimeraPy
  start: 2022.4
  end: 2023.9
  track: infra
  summary: >-
