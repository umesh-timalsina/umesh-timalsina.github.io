# Mounts
# The site's presentation lives in this repo (layouts/, assets/). Only small,
# focused Hyas modules are mounted: images (img/figure shortcodes and the
# markdown image render hook), SEO (meta, OpenGraph, JSON-LD, sitemap, robots)
# and inline SVG icons (Tabler).

## assets
[[mounts]]
  source = "assets"
  target = "assets"

[[mounts]]
  source = "node_modules/@hyas/images/assets"
  target = "assets"

[[mounts]]
  source = "node_modules/@tabler/icons/icons"
  target = "assets/svgs/tabler-icons"

## content
[[mounts]]
  source = "content"
  target = "content"

## data
[[mounts]]
  source = "data"
  target = "data"

## layouts (first match wins: local overrides come first)
[[mounts]]
  source = "layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/seo/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/images/layouts"
  target = "layouts"

[[mounts]]
  source = "node_modules/@hyas/inline-svg/layouts"
  target = "layouts"

## static
[[mounts]]
  source = "static"
  target = "static"
