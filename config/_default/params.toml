# Site
title = "Umesh Timalsina"
description = "Umesh Timalsina is a research software engineer at Vanderbilt University building AI-tutoring and real-time multimodal learning analytics platforms."
images = ["cover.png"]
mainSections = ["blog"]

# Profile — read by the homepage, header, footer, About and CV layouts.
# Leave a field empty ("") to hide it.
[profile]
  name = "Umesh Timalsina"
  role = "Lead System Engineer"
  affiliation = "ICONS (formerly the Institute for Software Integrated Systems), Vanderbilt University"
  affiliationShort = "Vanderbilt University"
  affiliationUrl = "https://www.isis.vanderbilt.edu"
  location = "Nashville, TN"
  tagline = "I build research software for learning: an LLM-powered tutoring platform in an OECD randomized controlled trial across European schools, and real-time multimodal analytics systems used in U.S. classroom studies."
  email = "umesh.timalsina26@gmail.com"
  github = "https://github.com/umesh-timalsina"
  linkedin = "https://www.linkedin.com/in/umesh-timalsina-812a4a103/"
  scholar = "https://scholar.google.com/citations?user=ePApBaMAAAAJ"
  orcid = ""   # TODO: ORCID URL
  cv = "/cv.pdf" # place the PDF at static/cv.pdf
  nameVariants = ["Umesh Timalsina", "U. Timalsina"] # bolded in author lists
  interests = [
    "AI in education & LLM tutoring",
    "Multimodal learning analytics",
    "Real-time streaming systems",
    "Research software engineering",
    "Deep learning for engineering design",
    "Cyber-physical systems",
  ]

# Debug
[render_hooks.image]
  errorLevel = 'ignore'

[render_hooks.link]
  errorLevel = 'ignore'
  highlightBroken = false

# Images (@hyas/images)
[hyas_images]
  [hyas_images.defaults]
    decoding = "async"
    fetchpriority = "auto"
    loading = "lazy"
    widths = [480, 576, 768, 1025, 1200, 1440]
    sizes = "auto"
    process = ""
    lqip = "16x webp q20"

# Inline SVG (@hyas/inline-svg)
[inline_svg]
  iconSetDir = "tabler-icons/outline"

# SEO (@hyas/seo)
[seo]
  [seo.title]
    separator = " · "
    suffix = ""
  [seo.favicons]
    sizes = []
    icon = "favicon.png"
    svgIcon = "favicon.svg"
    maskIcon = "mask-icon.svg"
    maskIconColor = "white"
  [seo.schemas]
    type = "Person"
    logo = "favicon-512x512.png"
    name = "Umesh Timalsina"
    sameAs = ["https://github.com/umesh-timalsina", "https://www.linkedin.com/in/umesh-timalsina-812a4a103/", "https://scholar.google.com/citations?user=ePApBaMAAAAJ"]
    images = ["cover.png"]
    article = []
    newsArticle = []
    blogPosting = ["blog"]
    product = []
