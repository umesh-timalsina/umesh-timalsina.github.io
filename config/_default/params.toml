# Site
title = "Umesh Timalsina"
description = "Umesh Timalsina is a research engineer at the Institute for Software Integrated Systems, Vanderbilt University, building systems for multimodal learning analytics."
images = ["cover.png"]
mainSections = ["blog"]

# Profile — read by the homepage, header, footer, About and CV layouts.
# Leave a field empty ("") to hide it.
[profile]
  name = "Umesh Timalsina"
  role = "Research Engineer"
  affiliation = "Institute for Software Integrated Systems, Vanderbilt University"
  affiliationShort = "ISIS · Vanderbilt University"
  affiliationUrl = "https://www.isis.vanderbilt.edu"
  location = "Nashville, TN"
  tagline = "I design and build software for multimodal learning analytics: real-time systems that collect, synchronize and process audio, video and interaction data from classrooms at scale."
  headshot = "" # e.g. "images/headshot.jpg" (in assets/); a monogram is shown when empty
  email = "umesh.timalsina26@gmail.com"
  github = "https://github.com/umesh-timalsina"
  linkedin = "https://www.linkedin.com/in/umesh-timalsina-812a4a103/"
  scholar = "" # TODO: Google Scholar profile URL
  orcid = ""   # TODO: ORCID URL
  cv = "/cv.pdf" # place the PDF at static/cv.pdf
  interests = [
    "Multimodal learning analytics",
    "Real-time media & data pipelines",
    "Distributed systems",
    "Research software engineering",
  ]

# Debug
[render_hooks.image]
  errorLevel = 'ignore'

[render_hooks.link]
  errorLevel = 'ignore'
  highlightBroken = false

# Images (@hyas/images)
[hyas_images]
  [hyas_images.defaults]
    decoding = "async"
    fetchpriority = "auto"
    loading = "lazy"
    widths = [480, 576, 768, 1025, 1200, 1440]
    sizes = "auto"
    process = ""
    lqip = "16x webp q20"

# Inline SVG (@hyas/inline-svg)
[inline_svg]
  iconSetDir = "tabler-icons/outline"

# SEO (@hyas/seo)
[seo]
  [seo.title]
    separator = " · "
    suffix = ""
  [seo.favicons]
    sizes = []
    icon = "favicon.png"
    svgIcon = "favicon.svg"
    maskIcon = "mask-icon.svg"
    maskIconColor = "white"
  [seo.schemas]
    type = "Person"
    logo = "favicon-512x512.png"
    name = "Umesh Timalsina"
    sameAs = ["https://github.com/umesh-timalsina", "https://www.linkedin.com/in/umesh-timalsina-812a4a103/"]
    images = ["cover.png"]
    article = []
    newsArticle = []
    blogPosting = ["blog"]
    product = []
